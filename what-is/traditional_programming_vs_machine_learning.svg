<svg width="100%" viewBox="0 0 680 470" role="img" style="" xmlns="http://www.w3.org/2000/svg">
<title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:22px;font-weight:400;text-anchor:start;dominant-baseline:auto">Traditional programming versus machine learning</title>
<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:22px;font-weight:400;text-anchor:start;dominant-baseline:auto">Two parallel flows. Left: a human writes exact rules, which are applied to new input, followed exactly, producing an output that is always exactly what the rules say. Right: a human designs a learning process, which is applied to data plus random starting weights, then trained through backpropagation, producing an output that is a prediction learned from data.</desc>
