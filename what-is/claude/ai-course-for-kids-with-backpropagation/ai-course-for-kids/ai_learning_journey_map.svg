<svg width="680" height="436" viewBox="0 0 680 436" xmlns="http://www.w3.org/2000/svg" role="img">
<title>The AI learning journey: eight stops from Rules to The future</title>
<desc>A winding path diagram showing eight connected stages of an AI course for teens: Rules, Learning, Neural networks, Backpropagation, Creating, Reasoning, Acting, and The future.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="436" fill="#FFFFFF"/>

<!-- Row 1 -->
<line x1="210" y1="128" x2="230" y2="128" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="400" y1="128" x2="420" y2="128" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<!-- Down into row 2 -->
<line x1="505" y1="156" x2="505" y2="220" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<!-- Row 2 (right to left) -->
<line x1="420" y1="248" x2="400" y2="248" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="230" y1="248" x2="210" y2="248" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<!-- Down into row 3 -->
<path d="M125 276 L125 308 L245 308 L245 340" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<!-- Row 3 -->
<line x1="330" y1="368" x2="350" y2="368" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Row 1: Rules, Learning, Neural networks -->
<g>
<rect x="40" y="100" width="170" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="125" y="118" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#085041">Rules</text>
<text x="125" y="136" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#0F6E56">If/then logic</text>
</g>

<g>
<rect x="230" y="100" width="170" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="315" y="118" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#085041">Learning</text>
<text x="315" y="136" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#0F6E56">Patterns from data</text>
</g>

<g>
<rect x="420" y="100" width="170" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="505" y="118" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#085041">Neural networks</text>
<text x="505" y="136" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#0F6E56">A trained model</text>
</g>

<!-- Row 2: Backpropagation, Creating, Reasoning -->
<g>
<rect x="420" y="220" width="170" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="505" y="238" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#085041">Backpropagation</text>
<text x="505" y="256" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#0F6E56">How training works</text>
</g>

<g>
<rect x="230" y="220" width="170" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="315" y="238" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#085041">Creating</text>
<text x="315" y="256" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#0F6E56">Makes new content</text>
</g>

<g>
<rect x="40" y="220" width="170" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="125" y="238" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#085041">Reasoning</text>
<text x="125" y="256" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#0F6E56">Thinks step by step</text>
</g>

<!-- Row 3: Acting, The future -->
<g>
<rect x="160" y="340" width="170" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="245" y="358" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#085041">Acting</text>
<text x="245" y="376" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#0F6E56">Tools &amp; robots</text>
</g>

<g>
<rect x="350" y="340" width="170" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="435" y="358" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#633806">The future</text>
<text x="435" y="376" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#854F0B">AGI and beyond</text>
</g>
</svg>
